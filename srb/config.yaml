# Cambia solo las IPs para desplegar en 3 máquinas.
# Máquina A: clientes | Máquina B: GT + RMC + cancelación | Máquina C: persistencia
persistence:
  bind: "tcp://*:5560"
  connect: "tcp://192.168.20.151:5560"     # IP del PC (servidor)
  db_path: "srb.db"
gt:
  frontend_bind: "tcp://*:5555"        # clientes -> GT (ROUTER)
  frontend_connect: "tcp://192.168.20.151:5555"   # IP del PC (servidor)
  backend_bind: "tcp://*:5556"         # GT -> RMC (DEALER)
  backend_connect: "tcp://192.168.20.151:5556"    # IP del PC (servidor)
  metrics_csv: "metrics_out/gt_metrics.csv"
cancel:
  bind: "tcp://*:5570"                 # GT -> cancelación (PUSH/PULL)
  connect: "tcp://192.168.20.151:5570"
timeouts_ms:
  persistence: 3000
  client: 5000